  <text x="280" y="185" class="text-accent">› ReAct Function Loop</text>
  <text x="280" y="210" class="text-sub">› Max Iterations: 8</text>
  <text x="280" y="235" class="text-sub">› Dynamic Tool Selection</text>
  <text x="280" y="260" class="text-sub">› Internal First Priority</text>
  <text x="280" y="285" class="text-accent">› Budget Defense In Depth</text>
  <text x="280" y="310" class="text-sub">› Intermediate Steps ON</text>

  <!-- 4 CONNECTED TOOLS -->
  <line x1="480" y1="160" x2="550" y2="100" class="line" />
  <line x1="480" y1="210" x2="550" y2="180" class="line" />
  <line x1="480" y1="260" x2="550" y2="260" class="line" />
  <line x1="480" y1="310" x2="550" y2="340" class="line" />

  <rect x="550" y="70" width="210" height="60" class="box" />
