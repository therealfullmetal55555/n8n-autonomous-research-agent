  <line x1="760" y1="205" x2="810" y2="205" class="line-solid" />

  <rect x="810" y="150" width="160" height="160" class="box-active" />
  <text x="825" y="180" class="text-title">BRIEF &amp; TRACE</text>
  <text x="825" y="205" class="text-accent">› Citation Diffing</text>
  <text x="825" y="225" class="text-sub">› Zero-Hallucination</text>
  <text x="825" y="245" class="text-sub">› Auto-Repair Pass</text>
  <text x="825" y="265" class="text-sub">› Google Doc Export</text>
  <text x="825" y="285" class="text-accent">› Trace Ledger Audit</text>

  <!-- FOOTER -->
  <text x="40" y="435" class="text-sub">FREE-TIER ARCHITECTURE ($0/MO)  |  8-CALL HARD BUDGET GUARD  |  EMPIRICAL REPRODUCIBILITY</text>
</svg>
